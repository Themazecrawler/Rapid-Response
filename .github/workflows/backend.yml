name: Backend CI

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rapid_response
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: rapid_response_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rapid_response -d rapid_response_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_USER: rapid_response
      DB_HOST: localhost
      DB_NAME: rapid_response_test
      DB_PASSWORD: ci_password
      DB_PORT: 5432
      NODE_ENV: test
      RUN_DB_TESTS: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14
      - name: Build production container
        run: docker build --tag rapid-response-backend:ci .
