name: Android CI

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', '*.md']
  pull_request:
    paths-ignore: ['backend/**', '*.md']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Provide placeholder config (real values are gitignored)
        run: |
          cp app/google-services.json.example app/google-services.json
          cp local.properties.example local.properties
      - run: chmod +x gradlew
      - run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug
          retention-days: 14
