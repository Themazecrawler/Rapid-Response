name: Android CI

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', '*.md']
  pull_request:
    paths-ignore: ['backend/**', '*.md']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Provide placeholder config (real values are gitignored)
        run: |
          cp app/google-services.json.example app/google-services.json
          cp local.properties.example local.properties
      - run: chmod +x gradlew
      - run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: app/build/outputs/apk
          retention-days: 14
